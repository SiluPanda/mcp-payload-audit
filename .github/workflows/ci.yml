name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python }}
      - run: uv sync --locked --group dev --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=mcp_payload_audit --cov-fail-under=90
      - run: uv build
      - name: Smoke test the wheel in an isolated environment
        run: uv run --isolated --no-project --with ./dist/mcp_payload_audit-0.1.0-py3-none-any.whl mcp-payload-audit audit examples/lean.json --max-bytes 65536
