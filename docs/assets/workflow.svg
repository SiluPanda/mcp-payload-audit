<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" width="1220" height="720" role="img" aria-labelledby="workflow-title workflow-description"><title id="workflow-title">Offline MCP payload audit workflow</title><desc id="workflow-description">Audit one saved result or compare a baseline and candidate. Inspect compact UTF-8 byte sizes, text and structured mirrors, repeated subtrees, and largest leaf values. Produce text or JSON reports and optionally enforce byte or growth budgets. No tool or model calls; no rewriting. Bytes are not tokens.</desc><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="1220" height="720" fill="#ffffff"></rect><g stroke-linecap="round" transform="translate(0 0) rotate(0 610 360)"><path d="M0 0 L1220 0 L1220 720 L0 720" stroke="none" stroke-width="0" fill="#fcfcfb"></path><path d="M0 0 C419.7 0, 839.41 0, 1220 0 M0 0 C376.42 0, 752.84 0, 1220 0 M1220 0 C1220 232.67, 1220 465.34, 1220 720 M1220 0 C1220 237.97, 1220 475.94, 1220 720 M1220 720 C853.4 720, 486.8 720, 0 720 M1220 720 C963.57 720, 707.14 720, 0 720 M0 720 C0 520.49, 0 320.99, 0 0 M0 720 C0 506.76, 0 293.51, 0 0" stroke="#fcfcfb" stroke-width="2" fill="none"></path></g><g transform="translate(48 28) rotate(0 350 12.5)"><text x="0" y="17.900390625" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="20px" fill="#0c766e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">mcp-payload-audit</text></g><g transform="translate(48 66) rotate(0 560 21.25)"><text x="0" y="30.4306640625" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="34px" fill="#233047" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Audit MCP results without running a server</text></g><g transform="translate(48 117) rotate(0 560 13.75)"><text x="0" y="19.6904296875" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="22px" fill="#526174" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">One saved response—or a before/after pair. Everything stays local.</text></g><g transform="translate(48 178) rotate(0 140 11.25)"><text x="0" y="16.1103515625" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="18px" fill="#526174" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">01  INPUT</text></g><g transform="translate(422 178) rotate(0 180 11.25)"><text x="0" y="16.1103515625" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="18px" fill="#526174" tex